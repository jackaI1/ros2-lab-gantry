[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gantry-lab"
version = "0.1.0"
description = "Reproducible perception and control experiments for my simulated gantry"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "matplotlib==3.9.2"]
[project.optional-dependencies]
vision = ["opencv-python-headless==4.10.0.84"]
cloud = ["open3d==0.19.0"]
learning = ["torch==2.5.1", "mujoco==3.2.7", "gymnasium==1.0.0", "stable-baselines3==2.4.1"]
test = ["pytest==8.3.4"]
[tool.setuptools.packages.find]
include = ["gantry_lab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
