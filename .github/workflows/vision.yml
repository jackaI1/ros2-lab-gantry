name: Well-plate detector
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  detector:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 2
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir './vision[learning,test]'
      - name: Unit tests for camera geometry, renderer, dataset, decoding and the ONNX training run
        run: |
          PYTHONPATH="$PWD/src/gantry_control:$PWD/vision" pytest -q vision/tests
      - name: Unit tests for the guide decision and protocol plate offsets
        run: PYTHONPATH="$PWD/src/gantry_control:$PWD/vision" pytest -q src/gantry_control/test/test_plate_guide.py src/gantry_control/test/test_protocol.py
      - name: Check the Gazebo world still matches the detector's plate geometry
        run: |
          python tools/make_vision_world.py
          git diff --exit-code -- src/gantry_description/worlds/lab_vision.sdf
      - name: Train on rendered scenes, score held-out scenes and export ONNX
        run: python -m gantry_vision.train --output artifacts/vision --epochs 20 --samples 1500 --world src/gantry_description/worlds/lab_vision.sdf
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: vision-evidence, path: artifacts/vision/}
