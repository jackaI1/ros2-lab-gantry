name: Simulation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS packages in Docker
        run: docker build -t lab-gantry .
      - name: Run unit and real Gazebo launch tests
        run: docker run --name gantry-ci --rm -e GANTRY_EVIDENCE_DIR=/ws/log/triage-evidence -v "$PWD/test-results:/ws/log" lab-gantry /ws/tools/test.sh
      - name: Run the documented three-well demo
        run: |
          mkdir -p logs
          docker run --name gantry-demo --rm -v "$PWD/logs:/logs" lab-gantry \
            /ws/tools/demo.sh --wells A1 A2 B2 --volume 50
      - name: Find the well plate in the simulated overhead camera
        run: |
          docker run -d --name gantry-vision --rm -v "$PWD/logs:/logs" lab-gantry \
            ros2 launch gantry_control simulation.launch.py vision:=true log_dir:=/logs
          docker exec gantry-vision /ws/tools/entrypoint.sh bash -c \
            'for i in $(seq 1 60); do ros2 topic list | grep -qx /overhead/image && break; sleep 2; done; ros2 run gantry_control plate_guide --once --wells A1 --timeout 90' \
            | tee logs/plate-guide.txt
          grep -q "plate pose from camera" logs/plate-guide.txt
      - name: Save tracking measurements and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence
          path: |
            logs/
            test-results/
      - name: Clean up owned containers
        if: always()
        run: docker rm -f gantry-ci gantry-demo gantry-vision 2>/dev/null || true
