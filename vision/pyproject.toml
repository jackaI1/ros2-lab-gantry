[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-vision"
version = "0.1.0"
description = "Well-plate detector for my simulated gantry camera"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "opencv-python-headless==4.10.0.84"]

[project.optional-dependencies]
inference = ["onnxruntime==1.20.1"]
learning = ["torch==2.5.1", "onnx==1.17.0"]
test = ["pytest==8.3.4", "onnxruntime==1.20.1"]

[tool.setuptools.packages.find]
include = ["gantry_vision*"]
